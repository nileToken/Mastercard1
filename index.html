<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Mastercard</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .card { border: 1px solid #000; padding: 20px; width: 300px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); }
        .card h2 { text-align: center; }
        .card p { margin: 5px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Mastercard</h2>
        <p><strong>Card Number:</strong> 1234 5678 9012 3456</p>
        <p><strong>Cardholder Name:</strong> John Doe</p>
        <p><strong>Expiry Date:</strong> 12/25</p>
        <p><strong>CVV:</strong> 123</p>
    </div>
</body>
</html>
